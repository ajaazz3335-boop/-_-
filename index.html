<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Байрактары — аренда автовышек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>:root{--g9:#14161A;--g8:#1F2329;--g7:#2E333B;--steel:#8A919B;--or:#FF681C;--or2:#E85A12;--or-t:#B8420A;--bg-l:#F4F2ED;--bg-l2:#F4F2ED;--tx-l:#191B1F;--ln-l:#D9D6CF;--hdr:72px;--h2:clamp(36px,5.2vw,64px);--dur-1:150ms;--dur-2:200ms;--dur-3:300ms;--ease:cubic-bezier(.16,1,.3,1);--tx-d:#ECEAE5;--head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--pad:clamp(20px,5vw,56px);--max:1240px;--sec:clamp(72px,10vw,128px);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 8px + env(safe-area-inset-top,0px));height:100%}
body{margin:0;min-height:100%;background:var(--g9);color:var(--tx-d);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g9);z-index:60}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
b,strong,h1,h2,h3{font-weight:600}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);container-type:inline-size;background:rgba(20,22,26,.97);border-bottom:1px solid var(--g7)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:100%}
.brand{display:flex;align-items:center;gap:12px;min-height:44px;font:600 24px var(--head);letter-spacing:.04em}
.brand i{width:16px;height:16px;background:var(--or)}
.top nav{display:none;gap:clamp(16px,2.4vw,32px);font-size:14px;color:var(--steel)}
.top nav a{display:inline-flex;align-items:center;min-height:44px;transition:color var(--dur-2) ease}
.top nav a:hover{color:var(--tx-d)}
.btn-num{display:none}
@container (min-width:1000px){.btn-num{display:inline;margin-left:8px}}
@media(min-width:768px){.top nav{display:flex}}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 32px;font:600 16px var(--body);border:1px solid transparent;cursor:pointer;transition:background-color var(--dur-2) ease,border-color var(--dur-2) ease,color var(--dur-2) ease;text-align:center}
.btn-sm{min-height:44px;padding:0 20px;font-size:14px;white-space:nowrap}
.btn-or{background:var(--or);color:var(--g9)}
.btn-or:hover{background:var(--or2)}
.btn-ln{border-color:var(--g7);color:var(--tx-d)}
.btn-ln:hover{border-color:var(--steel)}

/* HERO: scroll-driven видео. --p (0..1) выставляет applySceneProgress */
#top{--p:0}
.scene{--x:clamp(0,calc((var(--p) - .72) * 3.6),1);position:relative;height:420svh;margin-top:calc(-1 * var(--hdr))}
.scene--static{height:auto}
.pin{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--g9)}
.scene--static .pin{position:relative}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:78% 50%;filter:saturate(calc(.88 - var(--x) * .4)) contrast(calc(1 - var(--x) * .2)) brightness(calc(1 + var(--x) * .12))}
.shade{position:absolute;inset:0;opacity:calc(1 - var(--x) * .9);background:linear-gradient(90deg,rgba(20,22,26,.8) 0,rgba(20,22,26,.42) 42%,rgba(20,22,26,.06) 100%),linear-gradient(0deg,rgba(20,22,26,.92) 0,rgba(20,22,26,0) 50%),linear-gradient(180deg,rgba(20,22,26,.55) 0,rgba(20,22,26,0) 22%)}
.end{position:absolute;inset:0;pointer-events:none;opacity:clamp(0,calc(var(--x) * 6),1);background:linear-gradient(rgba(246,244,239,calc(var(--x) * .5)),rgba(246,244,239,calc(var(--x) * .5))),linear-gradient(0deg,#F6F4EF 0,#F6F4EF calc(var(--x) * 135% - 35%),rgba(246,244,239,0) calc(var(--x) * 135%))}
.copy-wrap{position:relative;z-index:3;height:100%}
.copy{display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:calc(var(--hdr) + 16px) 0 24px;opacity:clamp(0,calc(1 - (var(--p) - .06) * 4.5),1);transform:translateY(calc(var(--p) * -90px));will-change:opacity,transform}
.pin[data-copy="off"] .copy{visibility:hidden}
.beat{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(32px + env(safe-area-inset-bottom,0px));display:grid;justify-items:start;gap:24px;opacity:calc(clamp(0,calc((var(--p) - .5) * 8),1) * clamp(0,calc(1 - (var(--p) - .64) * 8),1))}
.beat p{max-width:14ch;font:600 clamp(40px,6vw,72px)/1.1 var(--head)}
.pin[data-beat="off"] .beat{visibility:hidden}
.ruler{position:absolute;z-index:3;right:16px;top:18%;bottom:18%;width:48px;opacity:clamp(0,calc(1 - var(--x) * 1.3),1)}
.ruler span{position:absolute;right:0;display:flex;align-items:center;gap:8px;flex-direction:row-reverse;font:600 12px/1.4 var(--head);letter-spacing:.06em;color:#B9BEC6;text-shadow:0 1px 6px rgba(0,0,0,.6);transform:translateY(50%)}
.ruler span::before{content:"";width:12px;height:1px;background:currentColor}
.mark{position:absolute;right:0;bottom:calc(var(--p) * (100% - 3px));width:32px;height:3px;background:var(--or)}
h1{font:600 clamp(48px,13vw,150px)/1.1 var(--head);text-transform:uppercase;margin-bottom:24px}
.ln{display:block;clip-path:inset(0 -60vw 0 0);padding-bottom:.04em}
.ln>span{display:block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.ln:nth-child(2){font-size:.42em;line-height:1.15;color:var(--or);letter-spacing:.02em}
.ln:nth-child(2)>span{animation-delay:.14s}
@keyframes up{to{transform:none}}
.fade{opacity:0;animation:fade .9s .45s forwards}
@keyframes fade{to{opacity:1}}
.lead{max-width:46ch;color:#C9CDD3;font-size:clamp(16px,1.5vw,19px)}
.cta{display:flex;flex-wrap:wrap;gap:16px;margin:32px 0}
.cta .btn{flex:1 1 100%}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(138,145,155,.35)}
.facts div{padding:16px 16px 0 0;display:flex;flex-direction:column;gap:4px}
.facts b{font:600 clamp(32px,5vw,48px)/1.1 var(--head)}
.facts span{font-size:14px;color:#B9BEC6;line-height:1.4}
@media(min-width:768px){
  .copy{width:min(58%,760px);justify-content:flex-start;padding-top:calc(var(--hdr) + clamp(40px,11vh,128px));padding-bottom:32px}
  .vid{object-position:70% 50%}
  .cta{margin:32px 0 0}
  .cta .btn{flex:0 0 auto}
  .facts{margin-top:auto}
  .ruler{right:max(24px,2.4vw);width:56px}
  .ruler span{font-size:14px}
}
@media(max-width:767.98px){.ruler{display:none}.scene{height:300svh}.vid{object-position:88% 50%}}

/* BRIDGE: слой с Vue Bits FloatingLines между hero и калькулятором (в секции калькулятора, читает тот же --p) */
.bridge{position:absolute;left:0;right:0;top:-55svh;height:110svh;z-index:0;pointer-events:none;overflow:hidden;opacity:calc(clamp(0,calc((var(--p) - .62) * 5),1) * .6);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 28%,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 28%,#000 52%,transparent 100%)}
.floating-lines-container{position:relative;width:100%;height:100%;overflow:hidden}
.scene--static::after{content:"";display:block;height:clamp(80px,14svh,140px);background:linear-gradient(180deg,var(--g9),#F6F4EF)}
@media(max-width:767.98px){.bridge{top:-80svh}}
.scene--static+.sec-calc{margin-top:0}
@media(prefers-reduced-motion:reduce){.sec-calc{margin-top:0}}

/* SCROLL FLOAT: заголовки появляются по буквам при прокрутке (src/lib/scrollFloat.ts) */
.sf{overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.sf-w{display:inline-block;white-space:nowrap}
.sf-c{display:inline-block;transform-origin:50% 0}

/* SECTIONS */
.sec{padding:var(--sec) 0}
.sec-l{background:var(--bg-l);color:var(--tx-l)}
.sec-l2{background:var(--bg-l2);color:var(--tx-l)}
.sec-d{background:var(--g9)}
.sh{display:grid;gap:16px;margin-bottom:clamp(32px,6vw,72px)}
h2{font:600 var(--h2)/1.1 var(--head);letter-spacing:-.005em}
.sh p{max-width:52ch;opacity:.74}
.reveal{opacity:0;transform:translateY(16px);transition:opacity var(--dur-3) ease-out,transform var(--dur-3) var(--ease)}
.reveal.in{opacity:1;transform:none}

/* CALC: калькулятор высоты на светлом фоне (под него выходит «мост» из hero) */
@property --f{syntax:'<number>';inherits:true;initial-value:0}
.sec-calc{position:relative;z-index:2;margin-top:-55svh;--c-bg:#F4F2ED;--c-tx:#191B1F;--c-mut:#686B70;--c-ln:#D9D6CF;padding-top:clamp(56px,7vw,96px);color:var(--c-tx);background:radial-gradient(760px 440px at 80% 62%,rgba(255,104,28,.05),transparent 65%),linear-gradient(180deg,#F6F4EF 0,#F4F2ED 45%,#F1EEE8 100%)}
.sec-calc .wrap{position:relative;z-index:1}
.sec-calc .reveal{transform:translateY(16px);transition:opacity var(--dur-3) ease-out,transform var(--dur-3) var(--ease);transition-delay:var(--d,0s)}
.sec-calc .reveal.in{transform:none}
.tasks.reveal{--d:30ms}.range.reveal{--d:60ms}.result.reveal{--d:90ms}
.sh--calc{gap:16px;margin-bottom:clamp(32px,4vw,48px)}
.sh--calc p{max-width:50ch;opacity:1;color:var(--c-mut)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--or-t)}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--or)}
.calc{display:flex;flex-wrap:wrap;align-items:stretch;gap:32px clamp(32px,4vw,56px)}
.calc-in{flex:1.1 1 380px;min-width:0}
.calc>.result{flex:.9 1 360px;min-width:0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 16px;padding:0;font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--c-mut)}
.lbl output{font:600 32px/1.2 var(--head);letter-spacing:.02em;text-transform:none;color:var(--c-tx);font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}
.tasks{border:0;margin:0 0 40px;padding:0;min-width:0}
.tasks legend{padding:0;float:left;width:100%}
.opts{clear:both;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{position:relative;display:flex}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt>span{position:relative;flex:1;display:flex;align-items:center;gap:16px;min-height:60px;padding:12px 16px 12px 20px;border:1px solid var(--c-ln);background:rgba(255,255,255,.55);color:var(--c-mut);line-height:1.3;transition:border-color var(--dur-2) ease,background-color var(--dur-2) ease,color var(--dur-2) ease,transform var(--dur-2) ease}
.opt>span::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--or);transform:scaleY(0);transform-origin:bottom;transition:transform var(--dur-3) var(--ease)}
.opt-n{flex:none;min-width:2ch;font:500 12px var(--body);font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--c-mut);transition:color var(--dur-2) ease}
.opt-t{min-width:0}
@media(hover:hover){.opt:hover>span{border-color:var(--or);color:var(--c-tx);transform:translateY(-2px)}.opt:hover .opt-n{color:var(--or-t)}}
.opt:active>span{transform:translateY(0)}
.opt input:checked+span{border-color:var(--or-t);background:rgba(255,104,28,.08);color:var(--c-tx)}
.opt input:checked+span::before{transform:scaleY(1)}
.opt input:checked+span .opt-n{color:var(--or-t)}
.opt input:focus-visible+span{outline:2px solid var(--or-t);outline-offset:3px}
.range{--tw:24px;position:relative}
.range input[type=range]{--pos:calc(var(--tw)/2 + (100% - var(--tw)) * var(--f));-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;transition:--f 100ms linear}
.range input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--or) var(--pos),var(--c-ln) var(--pos))}
.range input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--c-ln)}
.range input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--or)}
.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:var(--tw);height:var(--tw);margin-top:-8px;border-radius:50%;background:var(--c-tx);border:3px solid var(--or);box-shadow:0 0 0 3px var(--c-bg);transition:box-shadow var(--dur-2) ease}
.range input[type=range]::-moz-range-thumb{box-sizing:border-box;width:var(--tw);height:var(--tw);border-radius:50%;background:var(--c-tx);border:3px solid var(--or);box-shadow:0 0 0 3px var(--c-bg);transition:box-shadow var(--dur-2) ease}
.range input[type=range]:hover::-webkit-slider-thumb,.range input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--c-bg),0 0 0 9px rgba(255,104,28,.08)}
.range input[type=range]:hover::-moz-range-thumb,.range input[type=range]:active::-moz-range-thumb{box-shadow:0 0 0 3px var(--c-bg),0 0 0 9px rgba(255,104,28,.08)}
.range input[type=range]:focus-visible{outline:none}
.range input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--c-bg),0 0 0 5px var(--or-t)}
.range input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--c-bg),0 0 0 5px var(--or-t)}
.ticks{position:relative;height:8px;margin-top:-4px;pointer-events:none}
.ticks i{position:absolute;top:0;left:calc(var(--tw)/2 + (100% - var(--tw)) * var(--f));width:1px;height:8px;background:var(--c-mut);opacity:.55}
.scale{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--c-mut)}
.result{--mx:70%;--my:0%;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:clamp(24px,3.5vw,48px);color:var(--tx-d);background:linear-gradient(180deg,#1D2126,#191C20);border:1px solid #2E333B}
.result::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:linear-gradient(90deg,var(--or) 72px,var(--g7) 72px)}
@media(hover:hover){.result{background:radial-gradient(340px circle at var(--mx) var(--my),rgba(255,104,28,.09),transparent 70%),linear-gradient(180deg,#1D2126,#191C20)}}
.res-h{align-self:stretch;display:flex;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--g7);font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.big{margin-block:-.14em;font:600 clamp(112px,16vw,200px)/1.1 var(--head);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:.28em;color:var(--or);margin-left:.14em}
.result p{color:#B9BEC6;max-width:38ch}
.btn-cta{gap:16px;min-height:56px;padding:0 20px 0 24px;font-weight:600;letter-spacing:.01em;transition:background-color var(--dur-2) ease,transform var(--dur-1) ease}
.btn-cta .btn-ar{flex:none;box-sizing:content-box;padding-left:16px;border-left:1px solid rgba(20,22,26,.28);transition:transform var(--dur-3) var(--ease)}
@media(hover:hover){.btn-cta:hover{background:var(--or2)}.btn-cta:hover .btn-ar{transform:translate(3px,-3px)}}
.btn-cta:active{transform:scale(.98)}
.btn-cta:focus-visible{outline:2px solid var(--tx-d);outline-offset:3px}

/* FLEET: группы по высоте, строки-ведомость; раскладка строк зависит от ширины группы (container query) */
.grp{display:flex;flex-wrap:wrap;gap:16px 48px;margin-bottom:clamp(40px,6vw,72px)}
.grp-h{display:flex;flex:0 1 240px;flex-direction:column;gap:8px;align-self:flex-start;padding-top:16px}
.grp-h h3{font:600 clamp(24px,3vw,32px)/1.2 var(--head);color:var(--or)}
.grp-h span{color:var(--steel);font-size:14px}
.grp-rows{flex:1 1 480px;min-width:0;container-type:inline-size}
.row{position:relative;display:grid;grid-template-columns:1fr 72px;grid-template-areas:"num sil" "info act";align-items:center;gap:8px 24px;padding:16px 0;border-top:1px solid var(--g7)}
.grp-rows .row:last-child{border-bottom:1px solid var(--g7)}
.row::before{content:"";position:absolute;left:0;top:-1px;width:100%;height:1px;background:var(--or);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-3) var(--ease)}
@media(hover:hover){.row:hover::before{transform:scaleX(1)}.row:hover .sil{color:var(--tx-d)}}
.num{grid-area:num;margin-block:-.1em;font:600 clamp(64px,8vw,96px)/1.1 var(--head);letter-spacing:-.01em}
.num small{font-size:.26em;color:var(--or);margin-left:.14em}
.sil{grid-area:sil;width:100%;color:var(--steel);transition:color var(--dur-2) ease}
.sil .plat{stroke:var(--or)}
.info{grid-area:info;display:flex;flex-direction:column;gap:4px}
.info b{font-size:16px}
.info span{color:var(--steel);font-size:14px}
.act{grid-area:act;justify-self:end}
@container (min-width:520px){.row{grid-template-columns:minmax(120px,200px) 96px 1fr auto;grid-template-areas:"num sil info act";gap:24px}}

/* SERVICES */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 32px}
.s{position:relative;padding:24px 0 32px;border-top:1px solid var(--ln-l)}
.s::before{content:"";position:absolute;left:0;top:-1px;width:40px;height:2px;background:var(--or)}
.s h3{margin-bottom:12px;overflow-wrap:anywhere;font:600 clamp(24px,2.4vw,32px)/1.1 var(--head)}
.s p{max-width:36ch;opacity:.75}

/* TERMS: LineSidebar + SpotlightCard (Vue Bits; Tailwind-классы перенесены в обычный CSS) */
.terms{display:flex;flex-wrap:wrap;align-items:center;gap:32px clamp(32px,4vw,64px);overflow-x:clip}
.terms>.ls{flex:1 1 320px;min-width:0}
.terms>.tcard{flex:2 1 440px;min-width:0}
.ls{position:relative;display:flex;justify-content:flex-start;padding-left:calc(var(--marker-length) + var(--marker-gap))}
.ls-list{display:flex;flex-direction:column;gap:var(--item-gap);margin:0;padding:16px 0;list-style:none}
.ls-item{position:relative;display:flex;align-items:center;min-height:44px;cursor:pointer;padding-right:var(--max-shift);outline:none;-webkit-tap-highlight-color:transparent}
.ls-item::before{content:"";position:absolute;inset:-8px -48px}
.ls-item:not(:last-child)::after{content:"";position:absolute;left:calc(-1 * var(--marker-length) - var(--marker-gap));top:calc(100% + var(--item-gap) / 2);width:calc(var(--marker-length) * var(--tick-scale));height:1px;opacity:.5;background:var(--marker-color);transform-origin:left;transform:translateY(-50%) scaleX(calc(.7 + var(--effect,0) * .6))}
.ls-marker{position:absolute;top:50%;left:calc(-1 * var(--marker-length) - var(--marker-gap));width:var(--marker-length);height:1px;transform-origin:left;transform:translateY(-50%) scaleX(calc(.7 + var(--effect,0) * .5));background:color-mix(in srgb,var(--accent-color) calc(var(--effect,0) * 100%),var(--marker-color))}
.ls-label{position:relative;display:inline-flex;align-items:baseline;font:600 var(--font-size)/1.15 var(--head);letter-spacing:.01em;color:color-mix(in srgb,var(--accent-text) calc(var(--effect,0) * 100%),var(--text-color));transform:translateX(calc(var(--effect,0) * var(--max-shift)))}
.ls-index{margin-right:.7rem;font:500 .6em var(--body);font-variant-numeric:tabular-nums;letter-spacing:.04em;opacity:calc(.55 + var(--effect,0) * .45)}
.ls-item:focus-visible{outline:2px solid var(--accent-text);outline-offset:8px}
@media(max-width:767.98px){.ls-item::before{inset:-8px -12px}}
.spot{position:relative;overflow:hidden;border:1px solid #2E333B}
.spot-glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--dur-3) ease-in-out}
.tcard{display:flex;min-height:clamp(344px,36vw,456px);padding:clamp(24px,3.5vw,48px);color:var(--tx-d);background:linear-gradient(180deg,#1D2126,#191C20)}
.tcard::before{content:"";position:absolute;left:0;right:0;top:0;z-index:2;height:2px;background:linear-gradient(90deg,var(--or) 72px,#2E333B 72px)}
.tc-panel{position:relative;z-index:1;display:flex;flex:1;min-width:0}
.tc{position:relative;display:flex;flex:1;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
.tc .res-h{align-self:stretch}
.tc-num{position:absolute;right:-.03em;bottom:-.3em;font:600 clamp(160px,24vw,320px)/1.1 var(--head);letter-spacing:-.02em;color:rgba(255,255,255,.055);pointer-events:none;user-select:none}
.tc-title{position:relative;margin-top:auto;max-width:13ch;font:600 clamp(32px,4.4vw,56px)/1.1 var(--head)}
.tc-text{position:relative;max-width:36ch;color:#B9BEC6}
.tc-cta{position:relative}
.tc-enter-active,.tc-leave-active{transition:opacity var(--dur-3) ease-out,transform var(--dur-3) var(--ease)}
.tc-enter-from{opacity:0;transform:translateX(16px)}
.tc-leave-to{opacity:0;transform:translateX(-8px)}

/* SAFETY: AccordionGallery (Vue Bits), текстовые карточки без фото; до 900px ширины блока вертикальный аккордеон (container query) */
.ag-wrap{container-type:inline-size}
.ag{display:flex;gap:var(--ag-gap);height:var(--ag-h);perspective:1400px}
.ag-panel{position:relative;flex:1 1 0;min-width:0;overflow:hidden;cursor:pointer;border:1px solid #2E333B;background:linear-gradient(180deg,#1D2126,#191C20);transform:rotateY(var(--ag-rot,0deg));transition:flex-grow var(--dur-3) var(--ease),transform var(--dur-3) var(--ease),border-color var(--dur-2) ease}
.ag-panel:hover{border-color:#454B55}
.ag-panel.on{border-color:#3A4048;cursor:default}
.ag-panel::before{content:"";position:absolute;left:0;top:0;z-index:2;height:2px;width:72px;background:var(--or);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-3) var(--ease)}
.ag-panel.on::before{transform:scaleX(1)}
.ag-glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--dur-3) ease;background:radial-gradient(420px circle at 0% 100%,rgba(255,104,28,.14),transparent 70%)}
.ag-panel.on .ag-glow{opacity:1}
.ag-big{position:absolute;right:-.03em;bottom:-.3em;font:600 clamp(150px,18vw,260px)/1.1 var(--head);letter-spacing:-.02em;color:rgba(255,255,255,.05);pointer-events:none;user-select:none;opacity:0;transition:opacity var(--dur-3) ease}
.ag-panel.on .ag-big{opacity:1}
.ag-inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:clamp(20px,2.4vw,32px)}
.ag-idx{margin-bottom:auto;font:500 12px var(--body);font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--steel);transition:color var(--dur-2) ease}
.ag-panel.on .ag-idx{color:var(--or)}
.ag-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%;min-height:44px;margin:0;padding:0;border:0;background:none;color:#9AA0A9;text-align:left;cursor:inherit;font:600 clamp(22px,2.1vw,30px)/1.1 var(--head);transition:color var(--dur-2) ease}
.ag-head>span:first-child{min-width:0;overflow-wrap:anywhere}
.ag-panel:hover .ag-head{color:#C9CDD3}
.ag-panel.on .ag-head{color:var(--tx-d)}
.ag-head:focus-visible{outline:2px solid var(--or);outline-offset:8px}
.ag-plus{display:none}
.ag-bodywrap{display:grid;grid-template-rows:0fr;visibility:hidden;opacity:0;transition:grid-template-rows var(--dur-3) var(--ease),opacity var(--dur-2) ease,visibility 0s var(--dur-3)}
.ag-panel.on .ag-bodywrap{grid-template-rows:1fr;visibility:visible;opacity:1;transition:grid-template-rows var(--dur-3) var(--ease),opacity var(--dur-3) ease 100ms,visibility 0s}
.ag-body{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-height:0;padding-top:16px;overflow:hidden}
.ag-body p{max-width:34ch;color:#B9BEC6}
@container (max-width:900px){
  .ag{flex-direction:column;height:auto;perspective:none}
  .ag-panel{flex:none!important;transform:none!important}
  .ag-inner{height:auto;padding:16px 20px}
  .ag-idx{margin-bottom:8px}
  .ag-head{align-items:center;font-size:30px}
  .ag-plus{display:block;position:relative;flex:none;width:16px;height:16px}
  .ag-plus::before,.ag-plus::after{content:"";position:absolute;left:0;top:7px;width:16px;height:2px;background:currentColor;transition:transform var(--dur-3) ease}
  .ag-plus::after{transform:rotate(90deg)}
  .ag-panel.on .ag-plus::after{transform:rotate(0)}
  .ag-big{font-size:140px}
}

/* FAQ: аккордеон с плавным раскрытием и BlurText (Vue Bits, на CSS) */
.faq{display:grid;gap:8px 64px}
.qa{position:relative;border-bottom:1px solid var(--ln-l)}
.qa:first-child{border-top:1px solid var(--ln-l)}
.qa::before{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:1px;background:var(--or-t);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-3) var(--ease)}
.qa.on::before{transform:scaleX(1)}
.qa-h{font:inherit}
.qa-q{display:flex;width:100%;min-height:44px;justify-content:space-between;align-items:center;gap:24px;margin:0;padding:24px 0;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:600 clamp(18px,2vw,22px)/1.3 var(--body);transition:color var(--dur-2) ease}
@media(hover:hover){.qa-q:hover{color:var(--or-t)}}
.qa-q:focus-visible{outline:2px solid var(--or-t);outline-offset:4px}
.qa-ic{flex:none;width:16px;height:16px;background:linear-gradient(var(--or-t),var(--or-t)) center/100% 2px no-repeat,linear-gradient(var(--or-t),var(--or-t)) center/2px 100% no-repeat;transition:transform var(--dur-3) var(--ease)}
.qa.on .qa-ic{transform:rotate(45deg)}
.qa-body{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--dur-3) var(--ease),visibility 0s var(--dur-3)}
.qa.on .qa-body{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--dur-3) var(--ease),visibility 0s}
.qa-in{min-height:0;overflow:hidden}
.qa-a{padding:0 0 24px;max-width:58ch;opacity:.75}
.bt{display:flex;flex-wrap:wrap}
.bt-w{display:inline-block;opacity:0;will-change:transform,filter,opacity}
.bt.in .bt-w{animation:bt var(--bt-dur,.7s) linear both}
@keyframes bt{0%{opacity:0;filter:blur(10px);transform:translateY(var(--bt-y0,-50px))}50%{opacity:.5;filter:blur(5px);transform:translateY(var(--bt-y1,5px))}100%{opacity:1;filter:blur(0);transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.bt-w{opacity:1}}
@media(min-width:768px){.faq{grid-template-columns:5fr 7fr;align-items:start}.faq .sh{margin-bottom:0}}

/* REQUEST */
.req{display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px clamp(40px,6vw,96px)}
.req>:first-child{flex:1 1 320px;min-width:0}
.req>.form{flex:1.1 1 400px;min-width:0}
.req-p{margin:16px 0 24px;max-width:40ch;color:#B9BEC6}
.tel{display:inline-flex;align-items:center;min-height:44px;font:600 clamp(32px,4vw,56px)/1.1 var(--head);letter-spacing:.01em;white-space:nowrap;border-bottom:3px solid var(--or);padding-bottom:8px}
.hrs{margin-top:16px;color:var(--steel);font-size:14px}
.form{display:grid;gap:16px;align-content:start;background:var(--g8);border:1px solid var(--g7);padding:clamp(24px,4vw,40px)}
.form label{display:grid;gap:8px;font-size:14px;color:var(--steel)}
.form input,.form select,.form textarea{width:100%;min-height:56px;padding:0 16px;font:400 16px var(--body);color:var(--tx-d);background:var(--g9);border:1px solid var(--g7);border-radius:0;transition:border-color var(--dur-2) ease}
.form textarea{padding:16px;resize:vertical}
.form input:focus-visible,.form select:focus-visible,.form textarea:focus-visible{border-color:var(--or);outline:2px solid var(--or);outline-offset:2px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.form .chk{display:flex;align-items:center;gap:16px;min-height:44px;color:var(--tx-d)}
.form .chk input{width:24px;min-height:24px;height:24px;flex:none;accent-color:var(--or)}
.ok{padding:16px;border-left:3px solid var(--or);background:var(--g9);font-size:14px;color:#B9BEC6}

.foot{border-top:1px solid var(--g7);padding:32px 0 calc(40px + 72px);color:var(--steel);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 32px}
.foot a{display:inline-flex;align-items:center;min-height:44px}
@media(min-width:768px){.foot{padding-bottom:40px}}

/* MOBILE BAR */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:8px;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));background:rgba(20,22,26,.98);border-top:1px solid var(--g7);transform:translateY(110%);transition:transform var(--dur-3) var(--ease)}
.bar.show{transform:none}
.bar .btn{flex:1}
@media(min-width:768px){.bar{display:none}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ln>span{transform:none}.fade,.reveal{opacity:1;transform:none}
}
</style></head><body><div id="app"></div>
<script type="text/x-template" id="tpl">
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#top"><i></i>{{ site.brand }}</a>
      <nav><a v-for="n in nav" :key="n.href" :href="n.href">{{ n.label }}</a></nav>
      <a class="btn btn-or btn-sm" :href="site.phoneHref" :aria-label="`Позвонить ${site.phone}`">Позвонить<span class="btn-num">{{ site.phone }}</span></a>
    </div>
  </header>

  <main id="top">
    <HeroScrollVideo />

    <section id="pick" class="sec sec-d sec-calc">
    <div class="bridge" aria-hidden="true">
      <FloatingLines
        v-if="trails"
        :lines-gradient="trailGradient"
        :enabled-waves="trailWaves"
        :line-count="trailCount"
        :line-distance="trailDistance"
        :animation-speed="0.5"
        :interactive="false"
        :parallax="false"
        mix-blend-mode="normal"
        transparent
      />
    </div>
      <div class="wrap">
        <div class="sh sh--calc">
          <span class="eyebrow">Подбор высоты</span>
          <ScrollFloat>Какая высота нужна?</ScrollFloat>
          <p class="reveal">Выберите задачу и высоту работ — покажем ориентир для заявки. Точный подбор подтвердит менеджер.</p>
        </div>
        <div class="calc">
          <div class="calc-in">
            <fieldset class="tasks reveal">
              <legend class="lbl">Задача</legend>
              <div class="opts">
                <label v-for="(t, ti) in tasks" :key="t" class="opt">
                  <input v-model="form.task" type="radio" name="task" :value="t" />
                  <span><span class="opt-n" aria-hidden="true">{{ pad(ti + 1) }}</span><span class="opt-t">{{ t }}</span></span>
                </label>
              </div>
            </fieldset>
            <div class="range reveal">
              <div class="lbl"><label for="need">Нужная высота работ</label><output for="need">{{ needShown }} м</output></div>
              <input id="need" v-model.number="need" type="range" min="5" max="45" step="1" :style="{ '--f': (need - 5) / 40 }" />
              <div class="ticks" aria-hidden="true"><i v-for="f in fleet" :key="f.height" :style="{ '--f': (f.height - 5) / 40 }"></i></div>
              <div class="scale"><span>5 м</span><span>45 м</span></div>
            </div>
          </div>
          <div class="result reveal" @pointermove="spot">
            <div class="res-h"><span>Ориентир</span><span>работы на {{ need }} м</span></div>
            <div class="big" aria-hidden="true">{{ shown }}<small>м</small></div>
            <p aria-live="polite">Ориентировочно подойдёт автовышка от {{ rec.height }} м. Доступ, вылет и условия площадки уточнит менеджер.</p>
            <a class="btn btn-or btn-cta" href="#request" @click="form.height = String(rec.height)">
              <span>Запросить {{ rec.height }} м</span>
              <svg class="btn-ar" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12L12 4M5 4h7v7" /></svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <section id="fleet" class="sec sec-d">
      <div class="wrap">
        <div class="sh">
          <ScrollFloat>Линейка автовышек</ScrollFloat>
          <p class="reveal">Девять типоразмеров от 14 до 45 м. Характеристики и наличие сообщаем по запросу.</p>
        </div>
        <div v-for="g in groups" :key="g.title" class="grp">
          <div class="grp-h reveal"><h3>{{ g.title }}</h3><span>{{ g.note }}</span></div>
          <div class="grp-rows">
          <article v-for="f in g.items" :key="f.height" class="row reveal">
            <div class="num">{{ f.height }}<small>м</small></div>
            <svg class="sil" viewBox="0 0 100 114" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <rect x="8" y="94" width="72" height="9" rx="2" />
              <circle cx="22" cy="107" r="5" />
              <circle cx="62" cy="107" r="5" />
              <line x1="26" y1="92" :x2="26 + 50 * f.height / 45" :y2="92 - 78 * f.height / 45" />
              <rect class="plat" :x="26 + 50 * f.height / 45 - 6" :y="92 - 78 * f.height / 45 - 6" width="12" height="8" />
            </svg>
            <div class="info"><b>Автовышка {{ f.height }} м</b><span>Характеристики и наличие — по запросу</span></div>
            <a class="btn btn-ln btn-sm act" href="#request" @click="form.height = String(f.height)">Запросить</a>
          </article>
          </div>
        </div>
      </div>
    </section>

    <section id="services" class="sec sec-l">
      <div class="wrap">
        <div class="sh"><ScrollFloat>Услуги</ScrollFloat></div>
        <div class="svc">
          <div v-for="s in services" :key="s.title" class="s reveal">
            <h3>{{ s.title }}</h3>
            <p>{{ s.text }}</p>
          </div>
        </div>
      </div>
    </section>

    <section id="terms" class="sec sec-l">
      <div class="wrap">
        <div class="sh"><ScrollFloat>Условия работы</ScrollFloat></div>
        <div class="terms reveal">
          <LineSidebar
            v-model:active="termIndex"
            v-bind="lsConf"
            :items="termTitles"
            accent-color="#FF681C"
            accent-text-color="#B8420A"
            text-color="#686B70"
            marker-color="#B1ADA4"
            id-prefix="terms"
          />
          <SpotlightCard class-name="tcard" spotlight-color="rgba(255, 104, 28, 0.16)">
            <div id="terms-panel" class="tc-panel" role="tabpanel" :aria-labelledby="`terms-tab-${termIdx}`">
              <Transition name="tc" mode="out-in">
                <div :key="termIdx" class="tc">
                  <div class="res-h"><span>Условие</span><span>{{ pad(termIdx + 1) }} / {{ pad(terms.length) }}</span></div>
                  <span class="tc-num" aria-hidden="true">{{ pad(termIdx + 1) }}</span>
                  <h3 class="tc-title">{{ term.title }}</h3>
                  <p class="tc-text">{{ term.text }}</p>
                  <a class="btn btn-ln btn-sm tc-cta" href="#request">Обсудить условия</a>
                </div>
              </Transition>
            </div>
          </SpotlightCard>
        </div>
      </div>
    </section>

    <section id="safety" class="sec sec-d">
      <div class="wrap">
        <div class="sh">
          <ScrollFloat>Безопасность на высоте</ScrollFloat>
          <p class="reveal">Высотные работы требуют допусков, подготовленных людей и безопасной организации работ.</p>
        </div>
        <div class="reveal ag-wrap">
          <AccordionGallery :items="safety" cta-label="Уточнить у менеджера" cta-href="#request" id-prefix="safety" />
        </div>
      </div>
    </section>

    <section id="faq" class="sec sec-l">
      <div class="wrap faq">
        <div class="sh"><ScrollFloat>Частые вопросы</ScrollFloat></div>
        <div class="reveal">
          <div v-for="(q, i) in faq" :key="q.q" class="qa" :class="{ on: faqOpen === i }">
            <h3 class="qa-h">
              <button
                :id="`faq-q-${i}`"
                class="qa-q"
                type="button"
                :aria-expanded="faqOpen === i"
                :aria-controls="`faq-a-${i}`"
                @click="toggleFaq(i)"
              >
                <span>{{ q.q }}</span>
                <span class="qa-ic" aria-hidden="true"></span>
              </button>
            </h3>
            <div :id="`faq-a-${i}`" class="qa-body" role="region" :aria-labelledby="`faq-q-${i}`">
              <div class="qa-in">
                <BlurText
                  :key="`${i}-${faqRun[i]}`"
                  :text="q.a"
                  class-name="qa-a"
                  direction="bottom"
                  :distance="22"
                  :delay="45"
                  :step-duration="0.3"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="request" class="sec sec-d">
      <div class="wrap req">
        <div>
          <ScrollFloat>Оставьте заявку</ScrollFloat>
          <p class="req-p reveal">Опишите задачу, высоту и адрес. Мы уточним детали и согласуем условия.</p>
          <div class="reveal">
            <a class="tel" :href="site.phoneHref">{{ site.phone }}</a>
            <p class="hrs">{{ site.hours }}</p>
          </div>
        </div>
        <form class="form reveal" @submit.prevent="submitRequest">
          <div class="two">
            <label>Имя<input v-model="form.name" autocomplete="name" required /></label>
            <label>Телефон<input v-model="form.phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7" required /></label>
          </div>
          <label>Задача
            <select v-model="form.task">
              <option value="">Выберите задачу</option>
              <option v-for="t in tasks" :key="t">{{ t }}</option>
            </select>
          </label>
          <div class="two">
            <label>Высота
              <select v-model="form.height">
                <option value="">Пока не знаю</option>
                <option v-for="f in fleet" :key="f.height" :value="String(f.height)">{{ f.height }} м</option>
              </select>
            </label>
            <label>Дата<input v-model="form.date" type="date" /></label>
          </div>
          <label>Адрес или район<input v-model="form.address" autocomplete="street-address" /></label>
          <label>Комментарий<textarea v-model="form.comment" rows="3"></textarea></label>
          <label class="chk"><input v-model="form.agree" type="checkbox" required /><span>Согласен на обработку персональных данных</span></label>
          <button class="btn btn-or" type="submit">Отправить заявку</button>
          <p v-if="sent" class="ok" role="status">Демо-режим: заявка никуда не отправляется. Отправку в Telegram подключим на следующем этапе.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>{{ site.legal }}</span>
      <a :href="site.phoneHref">{{ site.phone }}</a>
      <span>Демо-версия. Характеристики, цены и документы уточняются.</span>
    </div>
  </footer>

  <div class="bar" :class="{ show: pastHero }">
    <a class="btn btn-ln btn-sm" :href="site.phoneHref">Позвонить</a>
    <a class="btn btn-or btn-sm" href="#request">Заявка</a>
  </div>

</script>
<script type="text/x-template" id="tpl-hero">
  <section ref="track" class="scene" :class="{ 'scene--static': isStatic }" aria-label="Аренда автовышек">
    <div ref="pin" class="pin" data-copy="on" data-beat="off">
      <img v-if="isStatic" class="vid" :src="posterStatic" alt="" />
      <video v-else ref="video" class="vid" :src="src" :poster="poster" muted playsinline preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true"></video>
      <div class="shade"></div>
      <div class="end"></div>
      <div class="ruler" aria-hidden="true">
        <span v-for="h in rulerHeights" :key="h" :style="{ bottom: ((h - 14) / 31 * 100) + '%' }">{{ h }}</span>
        <i class="mark"></i>
      </div>
      <div class="wrap copy-wrap">
        <div class="copy">
          <h1><span v-for="(l, i) in hero.lines" :key="i" class="ln"><span>{{ l }}</span></span></h1>
          <p class="lead fade">{{ hero.lead }}</p>
          <div class="cta fade">
            <a class="btn btn-or" href="#pick">Подобрать высоту</a>
            <a class="btn btn-ln" href="#request">Оставить заявку</a>
          </div>
          <div class="facts fade">
            <div v-for="f in hero.facts" :key="f.value"><b>{{ f.value }}</b><span>{{ f.label }}</span></div>
          </div>
        </div>

// Привязка currentTime видео к прокрутке. Без зависимостей и без Vue.

                               
                                                                     
                                               
                         
              
                                                      
                                  
 

const clamp = (v        , a = 0, b = 1) => Math.min(b, Math.max(a, v))

function createScrubber(o              ) {
  const { track, pin, video } = o
  const fps = o.fps ?? 30
  const k = o.smoothing ?? 0.22
  const frame = 1 / fps
  let target = 0
  let current = 0
  let raf = 0
  let duration = 0
  let destroyed = false
  let primed = false

  // 0 в момент, когда верх track у верха окна, 1 когда sticky-сцена доехала до низа track
  const measure = () => {
    const total = track.offsetHeight - pin.offsetHeight
    return total > 0 ? clamp(-track.getBoundingClientRect().top / total) : 0
  }

  const tick = () => {
    raf = 0
    if (destroyed) return
    target = measure()
    const d = target - current
    current = Math.abs(d) < 0.0003 ? target : current + d * k
    o.onProgress?.(current)

    // Новый seek только когда предыдущий завершён, иначе браузер копит очередь и кадры «прыгают»
    if (duration > 0 && !video.seeking) {
      const t = Math.min(Math.round(current * duration * fps) / fps, duration - frame / 2)
      if (Math.abs(video.currentTime - t) >= frame / 2) video.currentTime = t
    }
    if (current !== target || video.seeking) schedule()
  }

  const schedule = () => {
    if (!raf && !destroyed) raf = requestAnimationFrame(tick)
  }

  const onMeta = () => {
    if (Number.isFinite(video.duration) && video.duration > 0) duration = video.duration
    schedule()
  }

  // iOS Safari отдаёт кадры при seek только после первого play/pause
  const onData = () => {
    onMeta()
    if (primed) return
    primed = true
    const p = video.play()
    if (p && typeof p.then === 'function') p.then(() => { video.pause(); schedule() }).catch(() => {})
  }

  const onScroll = () => schedule()

  window.addEventListener('scroll', onScroll, { passive: true })
  window.addEventListener('resize', onScroll)
  video.addEventListener('loadedmetadata', onMeta)
  video.addEventListener('loadeddata', onData)
  video.addEventListener('seeked', schedule)
  if (video.readyState >= 1) onMeta()
  if (video.readyState >= 2) onData()
  schedule()

  return {
    destroy() {
      destroyed = true
      cancelAnimationFrame(raf)
      window.removeEventListener('scroll', onScroll)
      window.removeEventListener('resize', onScroll)
      video.removeEventListener('loadedmetadata', onMeta)
      video.removeEventListener('loadeddata', onData)
      video.removeEventListener('seeked', schedule)
    },
  }
}

// Синхронизация текста сцены с прогрессом: CSS-переменная и два флага видимости
// --p ставится на общий контейнер (main), поэтому его видят и сцена с видео, и «мост» в секции калькулятора
function applySceneProgress(pin             , p        ) {
  const root = pin.closest('main') ?? pin.parentElement ?? pin
  root.style.setProperty('--p', p.toFixed(4))
  root.dataset.bridge = p > 0.55 ? 'on' : 'off'

}


// Плавный счётчик: при смене источника число «доезжает» до нового значения.
// При prefers-reduced-motion значение меняется сразу.
function useTween(source              , ms = 360) {
  const out = ref(source())
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  let raf = 0
  watch(source, to => {
    cancelAnimationFrame(raf)
    if (reduce) { out.value = to; return }
    const from = out.value
    const t0 = performance.now()
    const step = (now        ) => {
      const k = Math.min(1, (now - t0) / ms)
      out.value = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))
      if (k < 1) raf = requestAnimationFrame(step)
    }
    raf = requestAnimationFrame(step)
  })
  onBeforeUnmount(() => cancelAnimationFrame(raf))
  return out
}

// Прокрутка управляет появлением заголовков по буквам (идея Vue Bits · ScrollFloat), без gsap и ScrollTrigger.
// Один общий слушатель на все заголовки: прогресс считается из положения элемента, поэтому анимация
// идёт вперёд при прокрутке вниз и назад при прокрутке вверх. Эффекты те же: opacity 0 → 1, сдвиг вниз 120% → 0,
// scaleY 2.3 → 1, scaleX 0.7 → 1, точка трансформации 50% 0%, ease back.inOut(2), задержка между буквами.

// back.inOut(overshoot) из gsap
const backInOut = (t        , overshoot = 2) => {
  const s = overshoot * 1.525;
  const x = t * 2;
  return x < 1 ? 0.5 * (x * x * ((s + 1) * x - s)) : 0.5 * ((x - 2) * (x - 2) * ((s + 1) * (x - 2) + s) + 2);
};

// 'top' | 'center' | 'bottom' | '40%' | '120px' с необязательным смещением '+=50%' / '-=40%'
const parsePos = (token        , size        )         => {
  const m = token.trim().match(/^(top|center|bottom|-?\d+(?:\.\d+)?%|-?\d+(?:\.\d+)?px)(?:([+-])=(\d+(?:\.\d+)?)(%|px))?$/);
  if (!m) return 0;
  const unit = (v        ) => (v.endsWith('%') ? (parseFloat(v) / 100) * size : parseFloat(v));
  const base = m[1] === 'top' ? 0 : m[1] === 'center' ? size / 2 : m[1] === 'bottom' ? size : unit(m[1]);
  if (!m[2]) return base;
  const off = m[4] === '%' ? (parseFloat(m[3]) / 100) * size : parseFloat(m[3]);
  return m[2] === '+' ? base + off : base - off;
};

// Прогресс 0..1 по положению элемента (top, h, высота окна vh); 0 в момент старта, 1 в момент конца
const progressAt = (top        , h        , vh        , start        , end        )         => {
  const [se, sv] = start.trim().split(/\s+/);
  const [ee, ev] = end.trim().split(/\s+/);
  const sd = top + parsePos(se, h) - parsePos(sv, vh); // сколько прокрутки до старта
  const ed = top + parsePos(ee, h) - parsePos(ev, vh); // сколько прокрутки до конца
  const range = ed - sd;
  return range > 0 ? clamp(-sd / range) : sd <= 0 ? 1 : 0;
};

const applyChars = (chars               , p        , duration        , stagger        ) => {
  const total = duration + stagger * (chars.length - 1);
  chars.forEach((c, i) => {
    const t = clamp((p * total - i * stagger) / duration);
    const e = backInOut(t);
    c.style.opacity = String(clamp(e));
    c.style.transform = `translateY(${(1 - e) * 120}%) scale(${0.7 + 0.3 * e}, ${2.3 - 1.3 * e})`;

  raf = 0;

    const p = progressAt(r.top, r.height, vh, it.start, it.end);
    if (Math.abs(p - it.last) < 0.0005) return;
    it.last = p;
    applyChars(it.chars, p, it.duration, it.stagger);

  if (bound) return;
  bound = true;
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
};

const unbind = () => {
  if (!bound) return;
  bound = false;
  window.removeEventListener('scroll', schedule);
  window.removeEventListener('resize', schedule);
  cancelAnimationFrame(raf);
  raf = 0;
};

function registerScrollFloat(el             , o                     = {})             {
  const it       = {
    el,

    start: o.start ?? 'top 92%',
    end: o.end ?? 'bottom 62%',
    duration: o.duration ?? 1,
    stagger: o.stagger ?? 0.03,
    last: -1
  };
  items.add(it);
  bind();
  frame();
  return () => {
    items.delete(it);
    it.chars.forEach(c => {
      c.style.opacity = '';
      c.style.transform = '';
    });
    if (!items.size) unbind();
  };
}

return { registerScrollFloat };
